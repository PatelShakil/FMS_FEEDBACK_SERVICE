version: '3.9'

services:
  feedback-service:
    build: .
    container_name: feedback-service
    restart: always
    ports:
      - "8088:8088"
    environment:
      NODE_ENV: production
      PORT: 8088
      MONGODB_URI: mongodb://boloindia:boloindiapass@mongodb:27017/feedback_db?authSource=admin
      KAFKA_BROKERS: kafka:19092
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
    volumes:
      - ./keys:/app/keys:ro
      - ./logs:/app/logs
    networks:
      - boloindia-net
    depends_on:
      - mongodb
      - kafka
      - minio
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8088/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  boloindia-net:
    external: true
